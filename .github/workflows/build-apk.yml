name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Fix Gradle Wrapper and Kotlin Version
        run: |
          flutter create . --platforms=android --project-name=bharat_mitra_v10
          if [ -f android/build.gradle ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.22'/g" android/build.gradle || true
            sed -i "s/kotlin-gradle-plugin:1\.[0-9]\+\.[0-9]\+/kotlin-gradle-plugin:1.9.22/g" android/build.gradle || true
          fi
          if [ -f android/settings.gradle ]; then
            sed -i "s/org.jetbrains.kotlin.android\" version \"[0-9.]*\"/org.jetbrains.kotlin.android\" version \"1.9.22\"/g" android/settings.gradle || true
          fi
          chmod +x android/gradlew || true
          chmod +x gradlew || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bharat-Mitra-APK
          path: build/app/outputs/flutter-apk/app-release.apk
