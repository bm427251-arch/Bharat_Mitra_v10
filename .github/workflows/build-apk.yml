name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Setup Android & Gradle Configuration
        run: |
          yes | sdkmanager --licenses || true
          if [ ! -f android/gradlew ]; then
            cp gradlew android/gradlew || true
          fi
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            cp gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar || true
          fi
          chmod +x android/gradlew || true
          chmod +x gradlew || true

      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: Bharat-Mitra-APK
          path: build/app/outputs/flutter-apk/app-release.apk
