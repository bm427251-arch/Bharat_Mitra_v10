name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Setup Android & Gradle Configuration
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create . --platforms=android --project-name=bharat_mitra_v10
          fi
          sed -i 's/version "8.3.2"/version "8.4.0"/' android/settings.gradle || true
          sed -i 's/version "1.9.0"/version "1.9.22"/' android/settings.gradle || true
          sed -i 's/gradle-[0-9.]\+-[a-z]\+\.zip/gradle-8.6-all.zip/' android/gradle/wrapper/gradle-wrapper.properties || true
          chmod +x android/gradlew || true

      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: Bharat-Mitra-APK
          path: build/app/outputs/flutter-apk/app-release.apk
