<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760">
  <!-- Transparent background as requested -->
  <g id="india_map_orange">
    <!-- North & West India Map in Orange #FF8C00 -->
    <path fill="#FF8C00" stroke="#0D1B68" stroke-width="4" stroke-linejoin="round" d="
      M 250 84
      L 260 72 L 270 76 L 286 88 L 296 104 L 312 92 L 310 116 L 300 132 L 306 152 L 296 168 L 320 184
      L 300 208 L 270 230 L 248 256 L 220 284 L 212 304
      L 180 300 L 160 308 L 150 288 L 170 280 L 164 260 L 172 250 L 182 220 L 176 190 L 192 168 L 210 150 L 224 116 Z
    " />
  </g>
  <g id="india_map_green">
    <!-- East & South India Map in Green #2E8B57 -->
    <path fill="#2E8B57" stroke="#0D1B68" stroke-width="4" stroke-linejoin="round" d="
      M 270 230
      L 300 208 L 330 206 L 360 216 L 390 200 L 416 220 L 440 210 L 460 228 L 476 216 L 490 240 L 470 264 L 440 270 L 420 310 L 390 320
      L 380 360 L 360 410 L 330 460 L 300 520 L 276 580 L 270 570 L 250 500 L 230 440 L 220 380 L 212 304
      L 220 284 L 248 256 Z
    " />
  </g>
  <g id="handshake">
    <!-- Handshake in Orange #FF8C00 with dark blue outlines -->
    <path fill="#FF8C00" stroke="#0D1B68" stroke-width="7" stroke-linejoin="round" d="
      M 220 290
      C 230 270, 270 250, 300 270
      L 360 330
      C 370 340, 380 360, 360 380
      L 320 420
      C 300 440, 280 430, 270 420
      L 220 370
      C 200 350, 200 320, 220 290 Z
    " />
    <!-- Handshake fingers -->
    <path fill="none" stroke="#0D1B68" stroke-width="5" stroke-linecap="round" d="
      M 310 370 L 350 330
      M 295 385 L 335 345
      M 280 400 L 320 360
      M 265 415 L 305 375
    " />
    <!-- Three Ashoka Blue dots arranged in triangle on handshake palm -->
    <circle cx="295" cy="330" r="10" fill="#1E70DC" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="280" cy="350" r="10" fill="#1E70DC" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="310" cy="350" r="10" fill="#1E70DC" stroke="#FFFFFF" stroke-width="2" />
  </g>
  <!-- Text: BHARAT MITRA -->
  <g id="bharat_mitra_text">
    <text x="300" y="670" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="56" text-anchor="middle" letter-spacing="4">
      <tspan fill="#FF8C00" stroke="#FFFFFF" stroke-width="8" paint-order="stroke fill">BHARAT </tspan>
      <tspan fill="#2E8B57" stroke="#FFFFFF" stroke-width="8" paint-order="stroke fill">MITRA</tspan>
    </text>
  </g>
</svg>